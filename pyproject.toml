[project]
name = "rbr-tpw"
version = "0.1.0"
description = "Command-line offload and setup of RBR loggers: CRC-checked download to CF NetCDF, clock skew, memory and battery state, configure and enable"
readme = "README.md"
authors = [
    { name = "Pat Welch", email = "pat@mousebrains.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
keywords = ["oceanography", "RBR", "RBRsolo", "data logger", "NetCDF", "CF conventions", "Ruskin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
    "netCDF4>=1.7",
    "numpy>=2.0",
    "pyserial>=3.5",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/mousebrains/RBR-tpw"
Source = "https://github.com/mousebrains/RBR-tpw"
Issues = "https://github.com/mousebrains/RBR-tpw/issues"

[project.scripts]
rbr-offload = "rbr_tpw.cli:main"

[dependency-groups]
dev = [
    "compliance-checker>=5.4.2",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rbr_tpw"
source-exclude = ["**/__pycache__"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:The ioos_sos checker is deprecated:DeprecationWarning"]
